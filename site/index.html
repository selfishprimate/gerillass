    <!--
      Google Analytics, property "Gerillass Web". One tag, loaded directly:
      what this site measures can be read here rather than downloaded from a
      container and disassembled, which is how the last setup had to be found.

      It runs on the site and while somebody is working on it, and nowhere
      else. Netlify gives every deploy its own hostname, and five of those had
      turned up in the tag's own diagnostics having sent real traffic into the
      property -- a preview is a copy of the site measuring itself as if it
      were the site, and its numbers are indistinguishable from real ones after
      the fact.

      `send_page_view: false` because this is a single page app. gtag would
      count the arrival and then nothing, since the other 81 routes never
      reload the document. Every view is sent from components/Analytics
      instead, the first one included, so there is one code path rather than an
      automatic one and a manual one that can disagree.

      `debug_mode` while working locally puts events in Analytics' DebugView.
    -->
    <script>
      (function () {
        var host = location.hostname;
        var live = host === 'gerillass.com' || host === 'www.gerillass.com';
        var local = host === 'localhost' || host === '127.0.0.1';
        if (!live && !local) return;

        window.dataLayer = window.dataLayer || [];
        /*
          Assigned to window rather than declared: inside this function a
          declaration would be local, and everything downstream looks for
          window.gtag.
        */
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-C92FKJBQ1B', {
          send_page_view: false,
          debug_mode: local
        });

        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=G-C92FKJBQ1B';
        document.head.appendChild(tag);
      })();
    </script>
