# Netlify configuration for gerillass.com.
#
# In the repository rather than the dashboard on purpose. The settings used to
# live only in the Netlify UI, which meant the one that mattered most --
# NODE_VERSION pinned to 14, because create-react-app 3 could not build on
# anything newer -- was invisible to anyone reading the code, and stayed put
# for years after the reason for it was gone.
#
# Netlify only reads a netlify.toml at the repository root. There is another
# one at site/public/netlify.toml which is therefore inert; it is commented out
# in full and kept only for the cache headers somebody drafted there.

[build]
  # The library lives at the root and the site lives in site/, so the build runs
  # from there and installs site/package.json rather than the library's.
  base = "site"
  command = "npm run build"

  # Relative to `base`, which is what Netlify does with paths in this file.
  # Confirmed on the first deploy from this repository rather than assumed.
  publish = "dist"

[build.environment]
  # Vite needs 18 or newer. This is the only place the version is set: the
  # dashboard variable that pinned it to 14 has been deleted, so there is one
  # answer rather than two. `.nvmrc` at the repository root is for people, not
  # for Netlify: with a base directory set, Netlify looks for it in site/.
  NODE_VERSION = "22"

# Three dashboard variables were deleted when this landed, and the site now has
# none at all:
#
#   NETLIFY_USE_YARN               the site is on npm, and its lockfile is
#                                  package-lock.json
#   NETLIFY_PRERENDER_ENABLED      Netlify's prerendering service, with its auth
#     and its auth token           token. It served crawlers a rendered copy of
#                                  what was then a client-rendered app, which is
#                                  how the site kept its search and social
#                                  previews. Every route is generated at build
#                                  time now, so there was nothing left for it to
#                                  do, and Netlify has deprecated it.

# Response headers. There were none until now: no transport policy, nothing
# stopping a browser from guessing at a content type, and no limit on what the
# page could be embedded in.
#
# Content-Security-Policy is deliberately not here. It is the one header that
# breaks a site silently when it is wrong, and this page loads a Typekit
# stylesheet, an ionicons module from unpkg, Google's tag, and renders every
# documentation example inside a srcdoc iframe. It deserves its own change,
# measured against a real page rather than guessed at.

[[headers]]
  for = "/*"
  [headers.values]
    # Two years, subdomains included: docs.gerillass.com serves over HTTPS
    # already, and it is the one subdomain that matters. `preload` is left off
    # on purpose -- getting off that list takes months, so it is a separate
    # decision rather than a side effect of adding headers.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

    # A browser should take the Content-Type at its word rather than sniffing
    # the bytes and deciding a file is something else.
    X-Content-Type-Options = "nosniff"

    # SAMEORIGIN rather than DENY: the documentation renders its examples in
    # iframes, and while those are srcdoc rather than page loads, a demo that
    # ever points at a real URL should not fail because of a header.
    X-Frame-Options = "SAMEORIGIN"

    # The full URL to same-origin destinations, the origin alone to others.
    # A documentation page's path can carry a member name, which is not
    # something a third party needs.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # None of these are used. Saying so means an embedded frame cannot ask for
    # them either.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

# Vite fingerprints everything under /assets, so the name changes whenever the
# bytes do and these can be cached for a year without ever going stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The fonts and icons in public/ are versioned by hand rather than by the
# build, so they get a week: long enough to be worth caching, short enough that
# replacing one reaches people.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
